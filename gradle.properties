# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# La cache de configuracion acelera las compilaciones repetidas.
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# KSP (Room) necesita registrar sus carpetas generadas; AGP 9 con Kotlin
# integrado lo bloquea por defecto. Este flag reactiva el comportamiento clasico.
android.disallowKotlinSourceSets=false

# El daemon de Gradle corre con JDK 21 (el JDK 25 rompe KSP). Se declara la
# ruta del JDK instalado para que no tenga que descargarlo.
org.gradle.java.installations.paths=C:\\Users\\marti\\.gradle\\jdks\\jdk-21.0.13+9
